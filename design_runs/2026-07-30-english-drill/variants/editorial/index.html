<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Drill</title>
<style>
/* ─────────────────────────────────────────────────────────────
   variant: editorial — 「上質な語学書の見開き」を判型で作る。
   装飾は足さない。余白・比率・字面だけで魅力を作る。
   基調は紙。低彩度。色相は 2つ（暖色ニュートラル + 藍のアクセント）まで。
   正誤は色で示さない — 出題中も答え合わせ中も、緑/赤を一切持たない。
   ───────────────────────────────────────────────────────────── */
:root {
  /* 紙とインク。暖色ニュートラル1系統。 */
  --paper:  #F7F4EE;
  --paper2: #EFEBE2;   /* 沈めるための面。ごく限定的に使う */
  --rule:   #D6CFC3;
  --ink:    #17150F;
  --muted:  #6A635A;   /* on --paper で 5.6:1 */
  --accent: #2B4661;   /* 低彩度の藍。on --paper で 9.4:1 */

  /* 階層は3段。38 / 22 / 13。段間 1.73 と 1.69（1.2倍問題を避ける）。 */
  --r1: 38px;   /* 問い。1画面に1つ */
  --r2: 22px;   /* 本文・選択肢・解説 */
  --r3: 13px;   /* 傍注・キーマップ */

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px; --s9: 96px;

  /* 書体は2ファミリー。明朝/セリフが主、等幅は数値と伏せ字だけ。 */
  --serif: ui-serif, "Iowan Old Style", Palatino, Georgia,
           "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  --mono:  ui-monospace, "SF Mono", Menlo, "Courier New", monospace;

  /* 段幅は px で持つ。ch は root の 17px に対して解決されるので、
     22px の passage を 40ch に組もうとすると実測 30ch まで痩せる。 */
  --colw-margin: 440px;  /* 傍注と passage の段。22px で約40字詰め */
  --colw-main:   480px;  /* 問いと解答の段 */
  --gutter: 72px;
  --keybar-h: 60px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--serif); font-size: 17px; line-height: 1.75;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}

/* 進捗。天の 2px だけ。数字より先に「あとどれくらいか」が伝わる。 */
#progress {
  position: fixed; inset: 0 auto auto 0; height: 2px; width: 0;
  background: var(--accent); transition: width .35s ease; z-index: 10;
}

/* ── 見開き ───────────────────────────────────────────────────
   左段＝文脈（傍注・passage）／右段＝問いと解答。
   3種すべてこの1つのグリッドに載る。語彙・文法では左段が傍注だけになり、
   本文が右に寄る。段が動かないので、問題が変わっても視線の始点が動かない。 */
main {
  /* border-box なので、段の合計に左右の padding を足しておかないと版面が痩せる */
  max-width: calc(var(--colw-margin) + var(--colw-main) + var(--gutter) + var(--s5) * 2);
  margin: 0 auto; padding: var(--s9) var(--s5) calc(var(--keybar-h) + var(--s8));
}
.spread {
  display: grid; align-items: start;
  grid-template-columns: minmax(0, var(--colw-margin)) minmax(0, var(--colw-main));
  gap: var(--gutter);
}

/* ── rank3: 傍注 ─────────────────────────────────────────────
   読ませない。目を上げれば在ることだけ分かればいい。
   padding-top は柱(folio)の1行目のベースラインを、右段の問いの1行目の
   ベースラインに合わせるための量。揃っていないと段がずれて見える。 */
.margin { font-size: var(--r3); line-height: 1.7; color: var(--muted); padding-top: 17px; }
/* 右段の1行目が 38px の問いでないときは、その分だけ柱を上げ直す。 */
.spread.verdict .margin { padding-top: 0; }
.spread.verdict .panel { padding-top: 9px; }
.spread.title-page .margin { padding-top: 37px; }
.folio {
  font-family: var(--mono); font-size: var(--r3); letter-spacing: .12em;
  margin: 0 0 var(--s3); color: var(--muted);
}
.folio b { color: var(--ink); font-weight: 400; letter-spacing: .06em; }
.margin hr {
  border: 0; border-top: 1px solid var(--rule); margin: 0 0 var(--s3);
}
.margin p { margin: 0 0 var(--s2); }
.tags { font-family: var(--mono); letter-spacing: .1em; }
.point { color: var(--ink); }
.stats { font-family: var(--mono); letter-spacing: .06em; }
.clock { font-variant-numeric: tabular-nums; }
.clock.over { color: var(--accent); }

/* ── rank2: passage ─────────────────────────────────────────
   引用の左罫は引かない。段そのものが引用の枠になっている。 */
.passage {
  font-size: var(--r2); line-height: 1.9; color: var(--ink);
  margin: var(--s6) 0 0; white-space: pre-wrap; hyphens: auto;
}

/* ── rank1: 問い ─────────────────────────────────────────── */
.stem {
  font-size: var(--r1); line-height: 1.32; font-weight: 400;
  letter-spacing: .005em; margin: 0 0 var(--s7); color: var(--ink);
}
.stem.en { letter-spacing: -.005em; }
/* 和文の語義が全角括弧で始まると、括弧の左サイドベアリングぶん1行目だけ
   右にずれて段の左端が折れて見える。その分だけ食い込ませて左端を揃える。 */
.lead-paren { text-indent: -.5em; }
/* 空所。文字は置かず、罫だけを置く。地の罫より濃くして「ここが問い」を示す。
   出題中も答え合わせの控えにも同じ形で出る。 */
.blank {
  display: inline-block; min-width: 3.2ch; height: 1em;
  border-bottom: 2px solid var(--accent); vertical-align: -.12em; margin: 0 .06em;
}

/* ── rank2: 選択肢 ───────────────────────────────────────────
   箱で囲わない。番号を版面の左に吊るし、行間と罫だけで列にする。 */
.choices { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.choices li { border-bottom: 1px solid var(--rule); }
.choices button {
  display: flex; align-items: baseline; gap: var(--s4);
  width: 100%; min-height: 52px; padding: var(--s3) var(--s2) var(--s3) 0;
  font: inherit; font-family: var(--serif); font-size: var(--r2); line-height: 1.5;
  text-align: left; color: var(--ink); background: transparent;
  border: 0; border-left: 2px solid transparent; cursor: pointer;
  transition: background .12s, border-color .12s, padding-left .12s;
}
.choices button:hover { background: var(--paper2); }
.choices button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.choices button[aria-pressed="true"] {
  border-left-color: var(--accent); padding-left: var(--s4); background: var(--paper2);
}
.choices .key {
  flex: none; width: 2ch; font-family: var(--mono); font-size: var(--r3);
  color: var(--muted); letter-spacing: 0;
}
.choices button[aria-pressed="true"] .key { color: var(--accent); }

/* ── 語彙タイピング ──────────────────────────────────────────
   確定分・カーソル・伏せ字を別に描く。罫を引いて「ここに打つ」と読ませる。 */
/* 打つ場所は問いと同じ大きさで置く。語彙は「読む」より「思い出して打つ」
   ほうが主なので、rank1 を語義と入力欄で分け合う。 */
.type-line {
  font-family: var(--mono); font-size: var(--r1); letter-spacing: .01em;
  min-height: 62px; margin: 0 0 var(--s4); word-break: break-word;
  border-bottom: 1px solid var(--ink); padding-bottom: var(--s3);
}
/* 伏せ字は「見えるが読ませない」濃度。ただし文字数は数えられる必要がある
   （3:1 を下回ると数え損ねる）。 */
.type-line .slot { letter-spacing: .38em; color: #8A8175; }
.type-line .ghost { color: var(--muted); }
.type-line .caret {
  display: inline-block; width: 2px; height: .95em; margin: 0 1px -.1em;
  background: var(--accent); animation: blink 1.1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.type-line.miss { animation: shake .16s; }
@keyframes shake {
  0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}
.hint-note { font-size: var(--r3); color: var(--muted); margin: 0; letter-spacing: .06em; }
#typeCatcher { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }

/* ── 答え合わせ ──────────────────────────────────────────────
   色を使わない。正誤は「語の大きさ」と「濃度」と「罫」で示す。
   右段を sticky にして、左段（問いと passage）がどれだけ長くても
   判定・解説・手応えが視野から出ない。 */
.panel {
  position: sticky; top: var(--s5);
  max-height: calc(100vh - var(--keybar-h) - var(--s6)); overflow-y: auto;
}
.verdict-word {
  font-size: var(--r1); line-height: 1.2; margin: 0 0 var(--s5);
  letter-spacing: .04em;
}
.verdict-word .sub {
  display: block; font-family: var(--mono); font-size: var(--r3);
  letter-spacing: .14em; color: var(--muted); margin-bottom: var(--s2);
}
.answer {
  font-family: var(--mono); font-size: var(--r2); margin: 0 0 var(--s3);
  color: var(--accent); word-break: break-word;
}
.example { font-size: var(--r2); color: var(--muted); margin: 0 0 var(--s4); }
.why {
  font-size: var(--r2); line-height: 1.8; margin: 0 0 var(--s6); color: var(--ink);
  padding-top: var(--s4); border-top: 1px solid var(--rule);
}
.note { font-size: var(--r3); color: var(--muted); margin: 0 0 var(--s3); letter-spacing: .04em; }
.note b { color: var(--ink); font-weight: 400; font-family: var(--mono); }

/* 手応え。ボタンらしさを消し、番号つきの目次の行にする。 */
.grades { list-style: none; margin: 0 0 var(--s4); padding: 0; border-top: 1px solid var(--rule); }
.grades li { border-bottom: 1px solid var(--rule); }
.grades button {
  display: flex; align-items: baseline; gap: var(--s4);
  width: 100%; min-height: 48px; padding: var(--s3) var(--s2) var(--s3) 0;
  font: inherit; font-family: var(--serif); font-size: var(--r2); text-align: left;
  color: var(--ink); background: transparent;
  border: 0; border-left: 2px solid transparent; cursor: pointer;
  transition: background .12s, border-color .12s, padding-left .12s;
}
.grades button:hover {
  background: var(--paper2); border-left-color: var(--accent); padding-left: var(--s4);
}
.grades button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.grades .key { flex: none; width: 2ch; font-family: var(--mono); font-size: var(--r3); color: var(--muted); }
.grades .when { margin-left: auto; font-family: var(--mono); font-size: var(--r3); color: var(--muted); }

/* 答え合わせ後の選択肢。緑/赤ではなく、濃度と左罫と小さな見出し語で示す。 */
/* 控えの問いと選択肢は別の役なので、罫に寄せない。 */
.recap-stem { font-size: var(--r2); line-height: 1.6; margin: var(--s6) 0 var(--s5); }
.choices button:disabled { cursor: default; }
.choices button.is-answer {
  border-left-color: var(--ink); padding-left: var(--s4); color: var(--ink);
}
.choices button.is-answer .key { color: var(--ink); }
.choices button.is-chosen-wrong { color: var(--muted); text-decoration: line-through;
  text-decoration-thickness: 1px; text-decoration-color: var(--rule); }
.choices button.is-idle { color: #8A8175; }
.choices .mark {
  margin-left: auto; flex: none; font-family: var(--mono); font-size: var(--r3);
  letter-spacing: .12em; color: var(--muted); text-decoration: none;
}

/* ── キーマップ ──────────────────────────────────────────────
   奥付の一行。読解で版面が伸びても、操作の手がかりは常に下端にある。 */
.keybar {
  position: fixed; inset: auto 0 0 0; z-index: 5;
  background: var(--paper); border-top: 1px solid var(--rule);
  height: var(--keybar-h); display: flex; align-items: center;
}
/* 版面と同じ箱にして、キーの説明が左段の左端から始まるようにする
   （中央寄せの箱をずらすと、下端だけ揃っていない画面に見える）。 */
.keybar > div {
  width: 100%;
  max-width: calc(var(--colw-margin) + var(--colw-main) + var(--gutter) + var(--s5) * 2);
  margin: 0 auto; padding: 0 var(--s5);
  font-family: var(--mono); font-size: var(--r3); color: var(--muted); letter-spacing: .06em;
}
.keybar kbd {
  font-family: var(--mono); font-size: var(--r3); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 2px; padding: 1px 5px; margin-right: 4px;
  background: var(--paper2);
}

/* ── 扉と奥付（開始・終了） ─────────────────────────────────── */
.title { font-size: 57px; line-height: 1.15; margin: 0 0 var(--s7); font-weight: 400; }
.setup { display: grid; gap: var(--s6); }
label { display: grid; gap: var(--s2); }
label > span { font-family: var(--mono); font-size: var(--r3); color: var(--muted); letter-spacing: .1em; }
select {
  font: inherit; font-family: var(--serif); font-size: var(--r2);
  padding: var(--s3) var(--s4); min-height: 48px; width: 100%;
  color: var(--ink); background: var(--paper);
  border: 0; border-bottom: 1px solid var(--ink); border-radius: 0;
}
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary {
  min-height: 48px; padding: 0 var(--s6); font: inherit; font-family: var(--serif);
  font-size: var(--r2); color: var(--paper); background: var(--accent);
  border: 0; border-radius: 2px; cursor: pointer; letter-spacing: .08em;
}
.primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.summary dl {
  display: grid; grid-template-columns: auto 1fr; gap: var(--s3) var(--s6);
  margin: 0 0 var(--s7); align-items: baseline;
}
.summary dt { font-family: var(--mono); font-size: var(--r3); color: var(--muted); letter-spacing: .1em; }
.summary dd { margin: 0; font-size: var(--r1); line-height: 1.1; font-variant-numeric: tabular-nums; }

/* ── レスポンシブ。段を畳んでも順序で階層を保つ。 ───────────── */
@media (max-width: 1000px) {
  :root { --colw-margin: 100%; --colw-main: 100%; --gutter: var(--s7); }
  main { max-width: 62ch; padding-top: var(--s7); }
  .spread { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; overflow: visible; }
  /* 1段に畳むと sticky が効かない。答え合わせだけは判定・解説・手応えを
     先に置き、スクロールなしで手応えに手が届くようにする。
     order は grid item（section / aside）にかける。panel は孫なので効かない。 */
  .spread.verdict > section { order: -1; }
  .spread.verdict .margin { padding-top: var(--s6); }
  .passage { margin-top: var(--s5); }
}
@media (max-width: 600px) {
  :root { --r1: 28px; --r2: 20px; }
  body { font-size: 16px; }
  main { padding: var(--s6) var(--s4) calc(var(--keybar-h) + var(--s7)); }
  .title { font-size: 38px; }
  .type-line { font-size: 24px; }
  .keybar > div { padding: 0 var(--s4); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="progress"></div>
<main id="app" aria-live="polite"></main>
<footer class="keybar" id="keybar" hidden><div></div></footer>
<input id="typeCatcher" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
       aria-label="英語を入力">

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ── サーバー ────────────────────────────────────────────────
async function api(path, options) {
  const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!response.ok) throw new Error(`${path}: ${response.status} ${await response.text()}`);
  return response.json();
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });

// ── 語彙タイピング ──────────────────────────────────────────
// 確定分と残りを別に描く。判定は自由入力＋1回提出（1文字ずつ弾く方式だと
// 総当たりで必ず正解に届いてしまい、「思い出せたか」を測れない）。
const typing = {
  value: "", pattern: "", hint: null,
  reset(pattern) { this.value = ""; this.pattern = pattern || ""; this.hint = null; },
  rest() {
    const source = this.hint || this.pattern;
    return [...source].slice([...this.value].length).join("");
  },
};

// ── 状態 ────────────────────────────────────────────────────
const MISS_FLASH_MS = 160;
const BUDGET_MS = { vocabulary: 6000, grammar: 10000, reading: 45000 };
const GRADES = [
  { value: 0, label: "もう一度", key: "1", when: "今日" },
  { value: 1, label: "難しい",   key: "2", when: "短く" },
  { value: 2, label: "普通",     key: "3", when: "標準" },
  { value: 3, label: "簡単",     key: "4", when: "長く" },
];
const KIND_NAMES = { vocab: "語彙", reading: "読解", grammar: "文法" };

const state = {
  sessionId: null, queue: [], current: null, answered: [], correct: 0,
  shownAt: 0, misses: 0, hintUsed: false, chosen: null,
  budgetTimer: null, lastAttemptId: null, phase: "setup",
};

// ── 画面の骨格 ──────────────────────────────────────────────
function setProgress(done, total) {
  $("progress").style.width = total ? `${Math.min(100, (done / (done + total)) * 100)}%` : "0";
}

// mod は右段の1行目の大きさ（=柱を合わせる相手）を伝えるためだけのもの。
function spread(marginHtml, mainHtml, mod) {
  return `<div class="spread${mod ? " " + mod : ""}"><aside class="margin">${marginHtml}</aside>` +
         `<section class="main">${mainHtml}</section></div>`;
}

function setKeybar(html) {
  const bar = $("keybar");
  bar.hidden = !html;
  bar.firstElementChild.innerHTML = html || "";
}

// 傍注。折り数（何問目か）を主、残りを従にする。
// 語彙は point を持たないので、品詞・コロケーションを注として置く
// （sub_skill の "recall" は本人に何も伝えないので出さない）。
function marginalia(item) {
  const done = state.answered.length;
  const total = done + state.queue.length + 1;
  const rate = done ? `　正答 ${Math.round((state.correct / done) * 100)}%` : "";
  const p = item.payload;
  const note = item.kind === "vocab"
    ? [p.part_of_speech, ...(p.collocations || [])].filter(Boolean).join(" · ")
    : (p.point || item.sub_skill);
  return `<p class="folio"><b>${String(done + 1).padStart(2, "0")}</b> / ${total}</p>
    <hr>
    <p class="tags">${esc(KIND_NAMES[item.kind] || item.kind)}　${"●".repeat(item.difficulty)}${"○".repeat(5 - item.difficulty)}</p>
    ${note ? `<p class="point">${esc(note)}</p>` : ""}
    <p class="stats"><span class="clock" id="clock">0:00</span>${rate}</p>`;
}

// 括弧・鉤括弧で始まる語義は1行目だけ字下がりして見える。組版側で詰める。
const leadParen = (text) => (/^[（(「『【〈《]/.test(String(text)) ? " lead-paren" : "");

function choiceList(choices) {
  return `<ul class="choices">${choices.map((c, i) => `
    <li><button data-choice="${i}" aria-pressed="false">
      <span class="key">${i + 1}</span><span>${esc(c)}</span></button></li>`).join("")}</ul>`;
}

// ── 開始 ────────────────────────────────────────────────────
async function renderSetup() {
  state.phase = "setup";
  const { courses } = await api("/api/courses");
  $("app").innerHTML = spread(
    `<p class="folio">127.0.0.1</p><hr><p class="point">English Drill</p>
     <p>毎日の分を、1問ずつ。</p>`,
    `<h1 class="title">今日の分を<br>やる</h1>
     <div class="setup">
       <label><span>科目・素材</span>
         <select id="course">${courses.map((c) =>
           `<option value="${esc(c.course_id)}">${esc(c.course_name)}</option>`).join("")}</select></label>
       <label><span>種別</span>
         <select id="kinds">
           <option value="">全部（語彙・読解・文法）</option>
           <option value="vocab">語彙</option>
           <option value="reading">読解</option>
           <option value="grammar">文法</option>
           <option value="reading,grammar">読解＋文法</option>
         </select></label>
       <div><button class="primary" id="start">開始</button></div>
     </div>`, "title-page");
  setKeybar("<kbd>↵</kbd> 開始");
  $("start").onclick = () => start().catch(fail);
  $("start").focus();
}

async function start() {
  const { session_id } = await post("/api/sessions", { course_id: $("course").value });
  Object.assign(state, { sessionId: session_id, answered: [], correct: 0 });
  state.kinds = $("kinds").value;
  state.courseId = $("course").value;
  state.queue = await fetchQueue();
  next();
}

async function fetchQueue() {
  const params = new URLSearchParams({ course: state.courseId, limit: "20" });
  if (state.kinds) params.set("kinds", state.kinds);
  if (state.answered.length) params.set("exclude", state.answered.join(","));
  const { items } = await api(`/api/queue?${params}`);
  return items;
}

async function next() {
  Object.assign(state, { misses: 0, hintUsed: false, chosen: null, lastAttemptId: null });
  clearInterval(state.budgetTimer);

  if (!state.queue.length) state.queue = await fetchQueue();
  state.current = state.queue.shift() || null;
  if (!state.current) return renderSummary();

  renderQuestion(state.current);
  state.phase = "question";
  state.shownAt = performance.now();
  startBudget(state.current.domain);
  setProgress(state.answered.length, state.queue.length + 1);
  window.scrollTo({ top: 0 });
}

function startBudget(domain) {
  // 想定時間を超えても止めない。落第させるためではなく、あとで speed_gap が
  // 付いた理由を本人が納得できるようにするための表示。
  const budget = BUDGET_MS[domain] || 30000;
  state.budgetTimer = setInterval(() => {
    const clock = $("clock");
    if (!clock) return clearInterval(state.budgetTimer);
    const elapsed = performance.now() - state.shownAt;
    const seconds = Math.floor(elapsed / 1000);
    clock.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    clock.classList.toggle("over", elapsed > budget);
  }, 500);
}

// ── 出題 ────────────────────────────────────────────────────
function renderQuestion(item) {
  const p = item.payload;
  let left = marginalia(item), body, keys;

  if (item.kind === "vocab") {
    typing.reset(p.answer_pattern);
    body = `<h1 class="stem${leadParen(p.meaning)}">${esc(p.meaning)}</h1>
      <p class="type-line" id="typeLine"></p>
      <p class="hint-note">英語で入力</p>`;
    keys = "<kbd>↵</kbd> 決定 　<kbd>Tab</kbd> ヒント 　<kbd>Esc</kbd> わからない";
  } else if (item.kind === "grammar") {
    body = `<h1 class="stem en">${esc(p.sentence).replace(/_{2,}/g,
      '<span class="blank"></span>')}</h1>
      ${choiceList(p.choices)}`;
    keys = "<kbd>1</kbd>–<kbd>4</kbd> 選択 　<kbd>↵</kbd> 決定";
  } else {
    left += `<div class="passage">${esc(p.passage)}</div>`;
    body = `<h1 class="stem">${esc(p.question)}</h1>${choiceList(p.choices)}`;
    keys = "<kbd>1</kbd>–<kbd>4</kbd> 選択 　<kbd>↵</kbd> 決定";
  }

  $("app").innerHTML = spread(left, body);
  setKeybar(keys);

  document.querySelectorAll("[data-choice]").forEach((button) => {
    button.onclick = () => choose(Number(button.dataset.choice));
  });
  if (item.kind === "vocab") { paintTypeLine(); focusCatcher(); }
}

function focusCatcher() { $("typeCatcher").focus({ preventScroll: true }); }

function paintTypeLine(shake) {
  const line = $("typeLine");
  if (!line) return;
  line.innerHTML = `<span class="done">${esc(typing.value)}</span><span class="caret"></span>`
    + `<span class="${typing.hint ? "ghost" : "slot"}">${esc(typing.rest())}</span>`;
  if (shake) {
    line.classList.add("miss");
    setTimeout(() => line.classList.remove("miss"), MISS_FLASH_MS);
  }
}

async function revealHint() {
  if (typing.hint) return;
  const { hint } = await api(`/api/hint?item_id=${state.current.item_id}`);
  typing.hint = hint;
  state.hintUsed = true;
  paintTypeLine();
}

function choose(index) {
  state.chosen = index;
  document.querySelectorAll("[data-choice]").forEach((b) =>
    b.setAttribute("aria-pressed", String(Number(b.dataset.choice) === index)));
}

// ── 答え合わせ ──────────────────────────────────────────────
async function submit(response) {
  clearInterval(state.budgetTimer);
  const result = await post("/api/answer", {
    session_id: state.sessionId,
    item_id: state.current.item_id,
    response: String(response),
    elapsed_ms: Math.round(performance.now() - state.shownAt),
    hint_used: state.hintUsed,
    retry_count: state.misses,
  });
  state.answered.push(state.current.item_id);
  if (result.correct) state.correct += 1;
  state.lastAttemptId = result.attempt_id;
  renderVerdict(result);
}

// 左段に問いの控え、右段に判定。正誤は色ではなく、語・濃度・罫で示す。
function recap(result) {
  const item = state.current;
  const p = item.payload;
  let html = marginalia(item);

  if (item.kind === "vocab") {
    html += `<p class="recap-stem${leadParen(p.meaning)}">${esc(p.meaning)}</p>
      <ul class="choices"><li><button disabled class="is-chosen-wrong">
        <span class="key">◦</span><span>${esc(typing.value || "（無答）")}</span>
        <span class="mark">じぶん</span></button></li></ul>`;
  } else if (p.choices) {
    html += `<p class="recap-stem">${item.kind === "grammar"
      ? esc(p.sentence).replace(/_{2,}/g, '<span class="blank"></span>')
      : esc(p.question)}</p>` + choiceList(p.choices);
  }
  if (item.kind === "reading") html += `<div class="passage">${esc(p.passage)}</div>`;
  return html;
}

function renderVerdict(result) {
  state.phase = "verdict";
  const item = state.current;

  const cause = result.error_cause
    ? `<p class="note">誤答原因 <b>${esc(result.error_cause)}</b> · 次の一手 <b>${esc(result.next_action)}</b></p>`
    : "";
  const candidate = result.revision_candidate_id
    ? `<p class="note">同じ箇所での誤答が続いたので、追記候補を立てました
       (#${result.revision_candidate_id})</p>` : "";
  const showAnswer = result.answer && (!result.correct || item.kind === "vocab");

  const panel = `<div class="panel">
      <h2 class="verdict-word"><span class="sub">${result.correct ? "CORRECT" : "INCORRECT"}</span>${result.correct ? "正解" : "誤り"}</h2>
      ${showAnswer ? `<p class="answer">${esc(result.answer)}</p>` : ""}
      ${result.example ? `<p class="example">${esc(result.example)}</p>` : ""}
      ${result.collocations?.length
        ? `<p class="note">${esc(result.collocations.join(" · "))}</p>` : ""}
      ${result.explanation ? `<p class="why">${esc(result.explanation)}</p>` : ""}
      ${cause}${candidate}
      <p class="note" style="margin:var(--s6) 0 var(--s2)">次はいつ出す？</p>
      <ul class="grades">${GRADES.map((g) => `
        <li><button data-grade="${g.value}"><span class="key">${g.key}</span>
          <span>${g.label}</span><span class="when">${g.when}</span></button></li>`).join("")}</ul>
      <p class="note">習熟度 <b>${esc(result.mastery)}</b>${
        result.interval_days != null ? ` · 次回 <b>${esc(result.interval_days)}日後</b>` : ""}</p>
    </div>`;

  $("app").innerHTML = spread(recap(result), panel, "verdict");

  // 答え合わせの選択肢は操作しない。正解＝濃いインクと左罫、選んだ誤答＝取り消し線。
  if (item.kind !== "vocab" && item.payload.choices) {
    document.querySelectorAll("[data-choice]").forEach((button) => {
      const i = Number(button.dataset.choice);
      button.disabled = true;
      const mark = document.createElement("span");
      mark.className = "mark";
      if (item.payload.choices[i] === result.answer) {
        button.classList.add("is-answer"); mark.textContent = "こたえ";
      } else if (i === state.chosen) {
        button.classList.add("is-chosen-wrong"); mark.textContent = "じぶん";
      } else {
        button.classList.add("is-idle");
      }
      if (mark.textContent) button.appendChild(mark);
    });
  }

  setKeybar("<kbd>1</kbd>–<kbd>4</kbd> 手応え 　<kbd>↵</kbd> 普通で次へ");
  document.querySelectorAll("[data-grade]").forEach((button) => {
    button.onclick = () => applyGrade(Number(button.dataset.grade));
  });
  window.scrollTo({ top: 0 });
}

async function applyGrade(value) {
  state.phase = "moving";
  if (state.lastAttemptId !== null) {
    await post("/api/grade", { attempt_id: state.lastAttemptId, grade: value });
  }
  state.phase = "question";
  next().catch(fail);
}

// ── 奥付 ────────────────────────────────────────────────────
async function renderSummary() {
  state.phase = "summary";
  setProgress(1, 0);
  const done = state.answered.length;
  const rate = done ? Math.round((state.correct / done) * 100) : 0;
  if (state.sessionId) await post(`/api/sessions/${state.sessionId}/end`, {}).catch(() => {});
  $("app").innerHTML = spread(
    `<p class="folio">セッション #${esc(state.sessionId)}</p><hr>
     <p>素材を足すなら</p>
     <p class="tags">english voa --limit 10</p>
     <p class="tags">english fetch-toeic</p>`,
    `<h1 class="title">おつかれさま</h1>
     <div class="summary">
       <dl>
         <dt>解答</dt><dd>${done}</dd>
         <dt>正答</dt><dd>${rate}%</dd>
       </dl>
       <p><button class="primary" id="again">もう一度</button></p>
     </div>`, "title-page");
  setKeybar("<kbd>↵</kbd> もう一度");
  $("again").onclick = () => renderSetup().catch(fail);
  $("again").focus();
}

function fail(error) {
  $("app").innerHTML = spread(`<p class="folio">ERROR</p><hr>`,
    `<h1 class="title">つながらない</h1><p class="note">${esc(error.message)}</p>`, "title-page");
  setKeybar("");
}

// ── キーボード ──────────────────────────────────────────────
document.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;

  if (state.phase === "setup") {
    if (event.key === "Enter") { event.preventDefault(); $("start")?.click(); }
    return;
  }
  if (state.phase === "verdict") {
    if (event.key === "Enter") { event.preventDefault(); applyGrade(2); return; }
    const grade = GRADES.find((g) => g.key === event.key);
    if (grade) { event.preventDefault(); applyGrade(grade.value); }
    return;
  }
  if (state.phase === "summary") {
    if (event.key === "Enter") { event.preventDefault(); $("again")?.click(); }
    return;
  }
  if (state.phase !== "question" || !state.current) return;

  if (state.current.kind === "vocab") {
    if (event.key === "Escape") { event.preventDefault(); return void submit("").catch(fail); }
    if (event.key === "Tab") { event.preventDefault(); return void revealHint().catch(fail); }
    if (event.key === "Enter") {
      event.preventDefault();
      if (!typing.value.trim()) { paintTypeLine(true); return; }
      return void submit(typing.value).catch(fail);
    }
    if (event.key === "Backspace") {
      event.preventDefault();
      typing.value = [...typing.value].slice(0, -1).join("");
      paintTypeLine(); return;
    }
    if (event.key.length !== 1) return;
    event.preventDefault();
    typing.value += event.key;
    paintTypeLine();
    return;
  }

  if (/^[1-9]$/.test(event.key)) {
    const index = Number(event.key) - 1;
    if (document.querySelector(`[data-choice="${index}"]`)) { event.preventDefault(); choose(index); }
    return;
  }
  if (event.key === "Enter" && state.chosen !== null) {
    event.preventDefault(); submit(state.chosen).catch(fail);
  }
});

// 語彙タイピング中はどこをクリックしてもキーを拾えるようにしておく。
document.addEventListener("click", () => {
  if (state.phase === "question" && state.current?.kind === "vocab") focusCatcher();
});

renderSetup().catch(fail);
state.phase = "setup";
</script>
</body>
</html>
