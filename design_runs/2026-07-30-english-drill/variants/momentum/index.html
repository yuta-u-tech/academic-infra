<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Drill</title>
<style>
/* ─────────────────────────────────────────────────────────────
   variant: momentum
   狙い —— 「進んでいる感じ」を記号（星・トロフィー）ではなく
   セッション内で実測できる値だけで作る。可視化は画面上端の rail 1本に集約し、
   本文領域は現行案より軽くする。主役は常に「いま解く1問」。
   ───────────────────────────────────────────────────────────── */
:root {
  --bg:      #0B0D10;
  --surface: #14181D;
  --border:  #232A32;
  --muted:   #8B949E;
  --fg:      #E6EDF3;
  --accent:  #4C8DFF;
  /* 状態色。出題中は使わない（色が答えの手がかりになるのを防ぐ）。 */
  --ok:      #3FB950;
  --ng:      #F85149;

  /* 階層は3段。段間 1.6倍。 */
  --r1: 32px;   /* 問題文 */
  --r2: 20px;   /* 選択肢・passage */
  --r3: 12px;   /* HUD・キーマップ */

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px; --s9: 96px;

  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
  --radius: 6px;

  --col: 720px;      /* 本文カラム外寸。内側 24px を除いた 672px が行長 */
  --hud: 76px;       /* 上端 HUD の高さ */
  --keys: 56px;      /* 下端キーバーの高さ */

  --ease: cubic-bezier(.2,.7,.2,1);
  --fast: 130ms;
}

* { box-sizing: border-box; }
/* .tag / .mastery は display を上書きしているので、hidden 属性を効かせ直す。 */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--sans); font-size: 16px; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
/* 数値は全部等幅・等幅数字。桁が変わっても隣が動かない。 */
.tnum { font-variant-numeric: tabular-nums; font-family: var(--mono); }

/* ── HUD（上端）───────────────────────────────────────────────
   rail と数値を常時見える位置に固定する。読解は passage が長く、
   スクロールで進捗が視界から消えると「あと何問か」が分からなくなる。
   高さ 68px 固定・要素は差分更新なので、問題が変わっても点滅しない。 */
.hud {
  position: fixed; inset: 0 0 auto 0; z-index: 8; height: var(--hud);
  background: linear-gradient(to bottom, var(--bg) 78%, transparent);
  padding: var(--s5) var(--s5) 0;
}
/* 本文カラムと同じ内側 24px を持たせて、rail の端 = 本文の端 を揃える。 */
.hud-inner { max-width: var(--col); margin: 0 auto; padding: 0 var(--s5); }

/* rail —— セッションの記録そのもの。1セグメント = 1問。
   明度3段だけで「残り / 済 / そのうち正解」を出す。色相は増やさない。
   正解が続くと明るい塊になる —— これが連続正解の可視化で、数字の演出は要らない。
   いま解いている1問だけが、想定時間をかけて左から埋まる（ペース）。 */
.rail { display: flex; gap: 2px; height: 5px; margin-bottom: var(--s3); }
.rail .seg {
  position: relative; flex: 1 1 0; min-width: 0; height: 100%;
  background: #1D242B; border-radius: 1px; overflow: hidden;
  transition: background 200ms var(--ease);
}
/* いま解いている位置の目印。pace が伸び始めれば覆われる。
   reduced-motion では pace が動かないので、この 2px だけが現在地を示す。 */
.rail .seg[data-state="now"] { box-shadow: inset 2px 0 0 var(--accent); }
.rail .seg[data-state="ok"] { background: var(--fg); }
.rail .seg[data-state="ng"] { background: #3E4751; }
.rail .pace {
  position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 1px;
  background: var(--accent); opacity: 0;
}
.rail .seg[data-state="now"] .pace { opacity: 1; }

/* HUD の数値行。rank3。読ませない、見えていればいい。 */
.meta {
  font-family: var(--mono); font-size: var(--r3); color: var(--muted);
  letter-spacing: .04em; line-height: 1.6;
}
.bar { display: flex; align-items: center; gap: var(--s4); }
.bar .spacer { flex: 1; }
.bar b { color: var(--fg); font-weight: 500; }
/* 桁の揺れ止め。1桁→2桁で隣がずれない。 */
.slot { display: inline-block; text-align: right; }
.w2 { width: 2ch; } .w3 { width: 3ch; }

.tag {
  display: inline-block; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1px var(--s2); color: var(--muted); white-space: nowrap;
}
/* 経過時間。想定時間を超えたら明度だけ上げる。色相は足さない。 */
.clock.over { color: var(--fg); }
/* 連続正解。2以上のときだけ出す。変化するものだけが動く。 */
#hStreak[hidden] { display: none; }

/* ── 本文 ───────────────────────────────────────────────────
   縦位置は種別によらず固定する。毎問ごとに stem の y が動くと、
   1問ごとに視線が主役を探し直すことになり、速く回すほど損をする。
   語彙・文法は上に余白を積んで stem を上中段へ、読解は passage が入るぶん詰める。 */
main {
  display: grid; align-content: start;
  min-height: 100vh; max-width: var(--col);
  margin: 0 auto; padding: calc(var(--hud) + var(--s3)) var(--s5) calc(var(--keys) + var(--s7));
}
main.roomy { padding-top: calc(var(--hud) + 96px); }
/* 問題の入れ替え。90ms で消え 140ms で入る。速く回せることが気持ちよさになる。 */
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
#app.enter { animation: rise 140ms var(--ease); }

/* キーマップは下端に固定。読解でも操作説明に必ず到達できる。 */
.keybar {
  position: fixed; inset: auto 0 0 0; z-index: 5;
  background: linear-gradient(to top, var(--bg) 72%, transparent);
  padding: var(--s5) var(--s5) var(--s4);
}
.keybar > div { max-width: var(--col); margin: 0 auto; padding: 0 var(--s5); }
kbd {
  font-family: var(--mono); font-size: var(--r3); color: var(--fg);
  border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; margin-right: 3px;
}

/* ── rank1: 主役。1画面に1つだけ。────────────────────────────── */
.point { margin: 0 0 var(--s4); }
.stem {
  font-size: var(--r1); line-height: 1.45; font-weight: 600;
  letter-spacing: -.01em; margin: 0 0 var(--s5);
}
.stem.en { font-family: var(--mono); font-weight: 500; letter-spacing: 0; }
/* 空所。アンダースコアのままだと文頭では浮いた罫線に見える。枠として見せる。 */
.stem .blank {
  display: inline-block; min-width: 4ch; color: transparent;
  border-bottom: 2px solid var(--accent); vertical-align: -2px;
}

/* rank2: passage。英文は等幅にして選択肢の語形差と目を揃える。 */
.passage {
  font-family: var(--mono); font-size: var(--r2); line-height: 1.7;
  margin: 0 0 var(--s4); padding-left: var(--s4);
  border-left: 2px solid var(--border); max-width: 66ch; white-space: pre-wrap;
}

/* ── rank2: 選択肢 ───────────────────────────────────────────
   選択マーカーは共有の1本だけ。選択が動くとマーカーが滑って追う。
   行ごとに枠線を塗り替えるより、視線が「いまどこか」を失わない。 */
.choices { position: relative; list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s1); }
.choices .marker {
  position: absolute; left: 0; top: 0; width: 2px; height: 0; opacity: 0;
  background: var(--accent); border-radius: 1px;
  transition: transform var(--fast) var(--ease), height var(--fast) var(--ease), opacity 90ms linear;
}
.choices.armed .marker { opacity: 1; }
.choices button {
  display: flex; align-items: flex-start; gap: var(--s4);
  width: 100%; min-height: 44px; padding: var(--s3) var(--s4) var(--s3) var(--s4);
  font: inherit; font-size: var(--r2); line-height: 1.5; text-align: left;
  color: var(--fg); background: transparent;
  border: 1px solid transparent; border-radius: var(--radius);
  cursor: pointer; transition: background var(--fast), border-color var(--fast), color var(--fast);
}
.choices button:hover { background: #10141A; }
.choices button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.choices button[aria-pressed="true"] { background: var(--surface); }
.choices .key {
  flex: none; width: 22px; height: 22px; margin-top: 3px;
  display: grid; place-items: center;
  font-family: var(--mono); font-size: var(--r3); color: var(--muted);
  border: 1px solid var(--border); border-radius: 3px;
  transition: color var(--fast), border-color var(--fast);
}
.choices button[aria-pressed="true"] .key { color: var(--accent); border-color: var(--accent); }
/* 答え合わせ後のみ正誤色を使う。 */
.choices button.is-answer { border-color: var(--ok); }
.choices button.is-answer .key { color: var(--ok); border-color: var(--ok); }
.choices button.is-chosen-wrong .key { color: var(--ng); border-color: var(--ng); }
.choices button.is-chosen-wrong span:last-child { color: var(--ng); }
.choices button[disabled] { cursor: default; opacity: 1; }
.choices .en { font-family: var(--mono); }

/* ── 語彙タイピング ─────────────────────────────────────────
   確定分・カーソル・残りゴーストを別に描く。下罫線を引くのは
   「ここに打つ」と分かる形にするため（罫線が無いと伏せ字が宙に浮く）。 */
.type-line {
  font-family: var(--mono); font-size: var(--r1); letter-spacing: .02em;
  min-height: 52px; margin: 0 0 var(--s3); word-break: break-word;
  border-bottom: 1px solid var(--border); padding-bottom: var(--s3); max-width: 24ch;
}
.type-line .slot-dots { letter-spacing: .35em; color: #46505C; }
.type-line .done { color: var(--fg); }
.type-line .ghost { color: var(--muted); }
.type-line .caret {
  display: inline-block; width: 2px; height: .95em; margin: 0 1px -.1em;
  background: var(--accent); animation: blink 1.1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.type-line.miss { animation: shake .16s; }
.type-line.miss .caret { background: var(--ng); }
@keyframes shake {
  0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}
#typeCatcher { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }

/* ── 答え合わせ ─────────────────────────────────────────────
   下部パネル。選んだ選択肢と正解は上に見えたまま残る。
   8px 下から 160ms で上がる。跳ねない。 */
/* body 直下に置く。main は問題の入れ替えで transform が乗るため、
   その中に fixed 要素を入れると包含ブロックが main になって panel が浮く。 */
.verdict {
  position: fixed; inset: auto 0 0 0; z-index: 6;
  background: var(--bg); border-top: 1px solid var(--border);
  box-shadow: 0 -16px 32px -16px #000;
  padding: var(--s5); max-height: 54vh; overflow-y: auto; overscroll-behavior: contain;
}
@keyframes lift { from { transform: translateY(8px); opacity: 0; } }
.verdict.lift { animation: lift 160ms var(--ease); }
.verdict > div { max-width: var(--col); margin: 0 auto; padding: 0 var(--s5); }
body.grading main { padding-bottom: 60vh; }

.vhead { display: flex; align-items: baseline; gap: var(--s4); margin: 0 0 var(--s3); }
.vhead h2 { font-size: var(--r2); margin: 0; font-weight: 600; }
.vhead h2.ok { color: var(--ok); } .vhead h2.ng { color: var(--ng); }
.vhead .spacer { flex: 1; }

/* 習熟度。数値だけだと 0.18 の意味が読めないので、10目盛の帯を添える。
   サーバーが返した値をそのまま出す（伸び幅は作らない）。 */
.mastery { display: inline-flex; align-items: center; gap: var(--s2); }
.mastery .cells { display: inline-flex; gap: 2px; }
.mastery i { width: 6px; height: 10px; background: var(--border); border-radius: 1px; }
.mastery i.on { background: var(--accent); }

.verdict .answer { font-family: var(--mono); font-size: var(--r2); margin: 0 0 var(--s3); }
.verdict .why { color: var(--muted); margin: 0 0 var(--s4); max-width: 66ch; }
.verdict .why b { color: var(--fg); font-weight: 500; }

/* パネルが内部スクロールしても手応えボタンは必ず見えている必要がある
   （狭い画面では解説だけで 54vh を使い切る）。下端に貼り付ける。 */
.grades {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2);
  position: sticky; bottom: var(--s5);
  background: var(--bg); padding-top: var(--s2);
}
.grades button {
  min-height: 44px; padding: var(--s2); font: inherit; font-size: 14px;
  color: var(--fg); background: transparent;
  border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer;
  display: grid; gap: 2px; justify-items: center;
  transition: border-color var(--fast), background var(--fast);
}
.grades button:hover { border-color: var(--muted); background: var(--surface); }
.grades button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grades small { font-family: var(--mono); font-size: var(--r3); color: var(--muted); }

/* ── 開始・終了 ─────────────────────────────────────────────── */
.setup { display: grid; gap: var(--s5); max-width: 420px; }
label { display: grid; gap: var(--s2); }
select {
  font: inherit; padding: var(--s3) var(--s4); min-height: 44px;
  color: var(--fg); background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
}
.primary {
  min-height: 44px; padding: 0 var(--s5); font: inherit; font-weight: 600;
  color: var(--bg); background: var(--accent);
  border: 0; border-radius: var(--radius); cursor: pointer;
}
.primary:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: var(--s5); margin: 0 0 var(--s6); max-width: 420px; }
.stats dt { font-family: var(--mono); font-size: var(--r3); color: var(--muted); margin: 0 0 var(--s1); }
.stats dd { margin: 0; font-size: var(--r2); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.railBig { height: 8px; }

@media (max-width: 600px) {
  :root { --r1: 24px; --r2: 17px; }
  main { padding: calc(var(--hud) + var(--s4)) var(--s4) calc(var(--keys) + var(--s6)); }
  .grades { grid-template-columns: repeat(2, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--s4); }
  .bar { gap: var(--s3); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="hud" id="hud" hidden>
  <div class="hud-inner">
    <div class="rail" id="rail" aria-hidden="true"></div>
    <div class="bar meta">
      <span><b class="tnum slot w2" id="hDone">0</b> / <span class="tnum slot w2" id="hTotal">0</span></span>
      <span>正答 <b class="tnum slot w2" id="hCorrect">0</b></span>
      <span id="hStreak" hidden>連続 <b class="tnum slot w2" id="hStreakN">0</b></span>
      <span class="spacer"></span>
      <span class="tnum clock" id="clock">0:00</span>
      <span class="tag" id="hKind"></span>
    </div>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<section class="verdict" id="verdict" hidden><div id="verdictBody"></div></section>
<footer class="keybar meta" id="keybar" hidden><div></div></footer>
<input id="typeCatcher" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
       aria-label="英語を入力">

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const still = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ── サーバー ────────────────────────────────────────────────
async function api(path, options) {
  const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!response.ok) throw new Error(`${path}: ${response.status} ${await response.text()}`);
  return response.json();
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });

// ── 語彙タイピング ──────────────────────────────────────────
// 1文字ずつ弾く方式は総当たりで必ず正解にたどり着けるので使わない。
// 自由入力＋1回提出で「思い出せたか」を測る。
const typing = {
  value: "", pattern: "", hint: null,
  reset(pattern) { this.value = ""; this.pattern = pattern || ""; this.hint = null; },
  rest() {
    const source = this.hint || this.pattern;
    return [...source].slice([...this.value].length).join("");
  },
};

// ── 状態 ────────────────────────────────────────────────────
const MISS_FLASH_MS = 160;
const BUDGET_MS = { vocabulary: 6000, grammar: 10000, reading: 45000 };
const GRADES = [
  { value: 0, label: "もう一度", key: "1" },
  { value: 1, label: "難しい",   key: "2" },
  { value: 2, label: "普通",     key: "3" },
  { value: 3, label: "簡単",     key: "4" },
];

// marks / streak / target はすべてセッション内で数え切れる値だけ。
// サーバーが返さない累積統計は作らない。
const state = {
  sessionId: null, queue: [], current: null, answered: [], correct: 0,
  shownAt: 0, misses: 0, hintUsed: false, chosen: null,
  budgetTimer: null, lastAttemptId: null, phase: "setup",
  target: 20, streak: 0, bestStreak: 0, marks: [], budget: 0,
};

// ── HUD ─────────────────────────────────────────────────────
function railTotal() {
  return Math.max(state.target, state.marks.length + (state.current ? 1 : 0));
}

// セグメントは差分更新する。作り直すと進行中の pace アニメーションが飛ぶ。
function renderRail() {
  const rail = $("rail");
  const total = railTotal();
  if (rail.childElementCount !== total) {
    rail.innerHTML = '<i class="seg"><i class="pace"></i></i>'.repeat(total);
  }
  [...rail.children].forEach((seg, i) => {
    const mark = state.marks[i];
    if (mark) seg.dataset.state = mark.correct ? "ok" : "ng";
    else if (i === state.marks.length && state.current) seg.dataset.state = "now";
    else seg.dataset.state = "rest";
  });
}

// いま解いている1問だけが動く。想定時間をかけて左から埋まる。
// reduced-motion では transition が殺されて一瞬で満杯になり嘘になるので、動かさない。
function startPace() {
  const seg = $("rail").children[state.marks.length];
  if (!seg) return;
  const pace = seg.firstElementChild;
  pace.style.transition = "none";
  pace.style.width = "0";
  if (still()) return;
  void pace.offsetWidth;
  pace.style.transition = `width ${state.budget}ms linear`;
  pace.style.width = "100%";
}

// 決定した瞬間に伸びを止める。答え待ちの間もバーが伸び続けると、
// 自分の解答時間より長い記録に見えて嘘になる。
function freezePace() {
  const seg = $("rail").children[state.marks.length];
  if (!seg) return;
  const pace = seg.firstElementChild;
  const width = getComputedStyle(pace).width;
  pace.style.transition = "none";
  pace.style.width = width;
}

function paintHud(item) {
  $("hud").hidden = false;
  $("hDone").textContent = state.answered.length + (item ? 1 : 0);
  $("hTotal").textContent = railTotal();
  $("hCorrect").textContent = state.correct;
  $("hStreak").hidden = state.streak < 2;
  $("hStreakN").textContent = state.streak;
  const names = { vocab: "語彙", reading: "読解", grammar: "文法" };
  $("hKind").textContent = item ? (names[item.kind] || item.kind) : "";
  $("hKind").hidden = !item;
  $("clock").hidden = !item;
}

function setKeybar(html) {
  const bar = $("keybar");
  bar.hidden = !html;
  bar.firstElementChild.innerHTML = html || "";
}

function paint(html) {
  const app = $("app");
  $("verdict").hidden = true;
  document.body.classList.remove("grading");
  app.classList.remove("enter", "roomy");
  app.innerHTML = html;
  void app.offsetWidth;
  app.classList.add("enter");
}

// ── 開始 ────────────────────────────────────────────────────
async function renderSetup() {
  state.phase = "setup";
  $("hud").hidden = true;
  const { courses } = await api("/api/courses");
  paint(`
    <p class="meta">127.0.0.1 · English Drill</p>
    <h1 class="stem">今日の分をやる</h1>
    <div class="setup">
      <label><span class="meta">科目・素材</span>
        <select id="course">${courses.map((c) =>
          `<option value="${esc(c.course_id)}">${esc(c.course_name)}</option>`).join("")}</select></label>
      <label><span class="meta">種別</span>
        <select id="kinds">
          <option value="">全部（語彙・読解・文法）</option>
          <option value="vocab">語彙</option>
          <option value="reading">読解</option>
          <option value="grammar">文法</option>
          <option value="reading,grammar">読解＋文法</option>
        </select></label>
      <label><span class="meta">今日の分</span>
        <select id="target">
          <option value="10">10問</option>
          <option value="20" selected>20問</option>
          <option value="40">40問</option>
        </select></label>
      <div><button class="primary" id="start">開始</button>
        <span class="meta" style="margin-left:var(--s3)">↵</span></div>
    </div>`);
  setKeybar("<kbd>↵</kbd> 開始");
  $("start").onclick = () => start().catch(fail);
  $("start").focus();
}

async function start() {
  const { session_id } = await post("/api/sessions", { course_id: $("course").value });
  Object.assign(state, {
    sessionId: session_id, answered: [], correct: 0,
    streak: 0, bestStreak: 0, marks: [],
  });
  state.kinds = $("kinds").value;
  state.courseId = $("course").value;
  state.target = Number($("target").value) || 20;
  state.queue = await fetchQueue();
  next();
}

async function fetchQueue() {
  const params = new URLSearchParams({ course: state.courseId, limit: "20" });
  if (state.kinds) params.set("kinds", state.kinds);
  if (state.answered.length) params.set("exclude", state.answered.join(","));
  const { items } = await api(`/api/queue?${params}`);
  return items;
}

async function next() {
  Object.assign(state, { misses: 0, hintUsed: false, chosen: null, lastAttemptId: null });
  clearInterval(state.budgetTimer);

  if (state.answered.length >= state.target) return renderSummary();
  if (!state.queue.length) state.queue = await fetchQueue();
  state.current = state.queue.shift() || null;
  if (!state.current) return renderSummary();

  state.budget = BUDGET_MS[state.current.domain] || 30000;
  renderQuestion(state.current);
  state.phase = "question";
  state.shownAt = performance.now();
  renderRail();
  startPace();
  startClock();
}

function startClock() {
  // 想定時間を超えても止めない。落第させるためではなく、あとで speed_gap が
  // 付いた理由を本人が納得できるようにするための表示。
  state.budgetTimer = setInterval(() => {
    const elapsed = performance.now() - state.shownAt;
    const seconds = Math.floor(elapsed / 1000);
    const clock = $("clock");
    clock.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    clock.classList.toggle("over", elapsed > state.budget);
  }, 500);
}

// ── 出題 ────────────────────────────────────────────────────
function choiceList(choices, mono) {
  return `<ul class="choices" id="choices"><i class="marker"></i>${choices.map((c, i) => `
    <li><button data-choice="${i}"${mono ? ' class="en"' : ""} aria-pressed="false">
      <span class="key">${i + 1}</span><span>${esc(c)}</span></button></li>`).join("")}</ul>`;
}

function renderQuestion(item) {
  const p = item.payload;
  const point = p.point || item.sub_skill;
  const head = point ? `<p class="meta point">${esc(point)}</p>` : "";
  let body, keys;

  if (item.kind === "vocab") {
    typing.reset(p.answer_pattern);
    const sub = [p.part_of_speech, ...(p.collocations || [])].filter(Boolean).join(" · ");
    body = `<h1 class="stem">${esc(p.meaning)}</h1>
      ${sub ? `<p class="meta" style="margin:calc(var(--s5) * -1) 0 var(--s6)">${esc(sub)}</p>` : ""}
      <p class="type-line" id="typeLine"></p>
      <p class="meta">英語で入力</p>`;
    keys = "<kbd>↵</kbd> 決定 　<kbd>Tab</kbd> ヒント 　<kbd>Esc</kbd> わからない";
  } else if (item.kind === "grammar") {
    body = `<h1 class="stem en">${esc(p.sentence).replace(/____/g,
      '<span class="blank">____</span>')}</h1>
      ${choiceList(p.choices, true)}`;
    keys = "<kbd>1</kbd>–<kbd>4</kbd> 選択 　<kbd>↵</kbd> 決定";
  } else {
    body = `<p class="passage">${esc(p.passage)}</p>
      <h1 class="stem">${esc(p.question)}</h1>
      ${choiceList(p.choices, true)}`;
    keys = "<kbd>1</kbd>–<kbd>4</kbd> 選択 　<kbd>↵</kbd> 決定";
  }

  paint(head + body);
  $("app").classList.toggle("roomy", item.kind !== "reading");
  paintHud(item);
  setKeybar(keys);

  document.querySelectorAll("[data-choice]").forEach((button) => {
    button.onclick = () => choose(Number(button.dataset.choice));
  });
  if (item.kind === "vocab") { paintTypeLine(); focusCatcher(); }
}

function focusCatcher() { $("typeCatcher").focus({ preventScroll: true }); }

function paintTypeLine(shake) {
  const line = $("typeLine");
  if (!line) return;
  line.innerHTML = `<span class="done">${esc(typing.value)}</span><span class="caret"></span>`
    + `<span class="${typing.hint ? "ghost" : "slot-dots"}">${esc(typing.rest())}</span>`;
  if (shake) {
    line.classList.add("miss");
    setTimeout(() => line.classList.remove("miss"), MISS_FLASH_MS);
  }
}

async function revealHint() {
  if (typing.hint) return;
  const { hint } = await api(`/api/hint?item_id=${state.current.item_id}`);
  typing.hint = hint;
  state.hintUsed = true;
  paintTypeLine();
}

// 選択マーカーを行へ滑らせる。押した瞬間に動くのが「効いている」感触になる。
function choose(index) {
  state.chosen = index;
  const list = $("choices");
  document.querySelectorAll("[data-choice]").forEach((b) =>
    b.setAttribute("aria-pressed", String(Number(b.dataset.choice) === index)));
  const target = document.querySelector(`[data-choice="${index}"]`);
  const marker = list?.querySelector(".marker");
  if (!target || !marker) return;
  marker.style.height = `${target.offsetHeight}px`;
  marker.style.transform = `translateY(${target.parentElement.offsetTop}px)`;
  list.classList.add("armed");
}

// ── 回答 ────────────────────────────────────────────────────
async function submit(response) {
  clearInterval(state.budgetTimer);
  const elapsed = Math.round(performance.now() - state.shownAt);
  freezePace();
  const result = await post("/api/answer", {
    session_id: state.sessionId,
    item_id: state.current.item_id,
    response: String(response),
    elapsed_ms: elapsed,
    hint_used: state.hintUsed,
    retry_count: state.misses,
  });
  state.answered.push(state.current.item_id);
  state.marks.push({ correct: !!result.correct, ratio: elapsed / state.budget });
  if (result.correct) {
    state.correct += 1;
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
  } else {
    state.streak = 0;
  }
  state.lastAttemptId = result.attempt_id;
  renderVerdict(result);
}

function masteryMeter(mastery) {
  const value = Number(mastery);
  if (!Number.isFinite(value)) return "";
  const on = Math.max(0, Math.min(10, Math.round(value * 10)));
  const cells = Array.from({ length: 10 }, (_, i) => `<i class="${i < on ? "on" : ""}"></i>`).join("");
  return `<span class="mastery meta">習熟度
    <span class="cells">${cells}</span>
    <b class="tnum">${value.toFixed(2)}</b></span>`;
}

function renderVerdict(result) {
  state.phase = "verdict";
  const p = state.current.payload;

  $("choices")?.classList.remove("armed");
  if (state.current.kind !== "vocab" && p.choices) {
    document.querySelectorAll("[data-choice]").forEach((button) => {
      const i = Number(button.dataset.choice);
      if (p.choices[i] === result.answer) button.classList.add("is-answer");
      else if (i === state.chosen) button.classList.add("is-chosen-wrong");
      button.disabled = true;
    });
  }

  const dots = `${"●".repeat(state.current.difficulty || 0)}${"○".repeat(Math.max(0, 5 - (state.current.difficulty || 0)))}`;
  const cause = result.error_cause
    ? `<p class="meta">誤答原因 <b>${esc(result.error_cause)}</b> · 次の一手 <b>${esc(result.next_action)}</b> · 難易度 ${dots}</p>`
    : `<p class="meta">難易度 ${dots}</p>`;
  const candidate = result.revision_candidate_id
    ? `<p class="meta">同じ箇所での誤答が続いたので、<b>追記候補</b>を立てました
       (#${result.revision_candidate_id})</p>` : "";

  document.body.classList.add("grading");
  renderRail();
  paintHud(null);
  $("verdictBody").innerHTML = `
      <div class="vhead">
        <h2 class="${result.correct ? "ok" : "ng"}">${result.correct ? "正解" : "不正解"}</h2>
        <span class="spacer"></span>
        ${masteryMeter(result.mastery)}
      </div>
      ${result.answer && (!result.correct || state.current.kind === "vocab")
        ? `<p class="answer">${esc(result.answer)}</p>` : ""}
      ${result.example ? `<p class="answer" style="color:var(--muted)">${esc(result.example)}</p>` : ""}
      ${result.collocations?.length
        ? `<p class="meta" style="margin:0 0 var(--s3)">${esc(result.collocations.join(" · "))}</p>` : ""}
      ${result.explanation ? `<p class="why">${esc(result.explanation)}</p>` : ""}
      ${cause}${candidate}
      <p class="meta" style="margin:var(--s5) 0 var(--s3)">次はいつ出す？</p>
      <div class="grades">${GRADES.map((g) => `
        <button data-grade="${g.value}">${g.label}<small>${g.key}</small></button>`).join("")}</div>`;
  const panel = $("verdict");
  panel.classList.remove("lift");
  panel.hidden = false;
  panel.scrollTop = 0;
  void panel.offsetWidth;
  panel.classList.add("lift");

  setKeybar("<kbd>1</kbd>–<kbd>4</kbd> 手応え 　<kbd>↵</kbd> 普通で次へ");
  document.querySelectorAll("[data-grade]").forEach((button) => {
    button.onclick = () => applyGrade(Number(button.dataset.grade));
  });
  (document.querySelector(".choices .is-answer") || document.querySelector(".stem"))
    ?.scrollIntoView({ behavior: still() ? "auto" : "smooth", block: "center" });
}

async function applyGrade(value) {
  state.phase = "moving";
  document.body.classList.remove("grading");
  $("verdict").hidden = true;
  if (state.lastAttemptId !== null) {
    await post("/api/grade", { attempt_id: state.lastAttemptId, grade: value });
  }
  state.phase = "question";
  next().catch(fail);
}

// ── 終了 ────────────────────────────────────────────────────
function median(values) {
  if (!values.length) return 0;
  const sorted = [...values].sort((a, b) => a - b);
  const middle = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
}

async function renderSummary() {
  state.phase = "summary";
  state.current = null;
  const done = state.answered.length;
  if (state.sessionId) await post(`/api/sessions/${state.sessionId}/end`, {}).catch(() => {});
  // 中央値。1問だけ極端に長いと平均が壊れる。
  const pace = median(state.marks.map((m) => m.ratio));
  paint(`
    <p class="meta">セッション #${esc(state.sessionId)}</p>
    <h1 class="stem">今日の分は終わり</h1>
    <div class="rail railBig" id="railBig" aria-hidden="true"></div>
    <dl class="stats" style="margin-top:var(--s5)">
      <div><dt>正答</dt><dd>${state.correct} / ${done}</dd></div>
      <div><dt>最長連続</dt><dd>${state.bestStreak}</dd></div>
      <div><dt>ペース（想定比）</dt><dd>${Math.round(pace * 100)}%</dd></div>
    </dl>
    <p class="meta">素材を足すなら
      <b>english voa --limit 10</b> / <b>english fetch-toeic</b></p>
    <p style="margin-top:var(--s6)"><button class="primary" id="again">もう一度</button></p>`);
  // 記録をそのまま大きく出す。HUD の rail と同じ読み方（明度＝正誤）にする。
  $("railBig").innerHTML = state.marks.map((m) =>
    `<i class="seg" data-state="${m.correct ? "ok" : "ng"}"></i>`).join("");
  paintHud(null);
  $("hud").hidden = true;
  setKeybar("<kbd>↵</kbd> もう一度");
  $("again").onclick = () => renderSetup().catch(fail);
  $("again").focus();
}

function fail(error) {
  $("hud").hidden = true;
  paint(`<h1 class="stem">つながらない</h1><p class="meta">${esc(error.message)}</p>`);
}

// ── キーボード ──────────────────────────────────────────────
document.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;

  if (state.phase === "setup") {
    if (event.key === "Enter") { event.preventDefault(); $("start")?.click(); }
    return;
  }
  if (state.phase === "verdict") {
    if (event.key === "Enter") { event.preventDefault(); applyGrade(2); return; }
    const grade = GRADES.find((g) => g.key === event.key);
    if (grade) { event.preventDefault(); applyGrade(grade.value); }
    return;
  }
  if (state.phase === "summary") {
    if (event.key === "Enter") { event.preventDefault(); $("again")?.click(); }
    return;
  }
  if (state.phase !== "question" || !state.current) return;

  if (state.current.kind === "vocab") {
    if (event.key === "Escape") { event.preventDefault(); return void submit("").catch(fail); }
    if (event.key === "Tab") { event.preventDefault(); return void revealHint().catch(fail); }
    if (event.key === "Enter") {
      event.preventDefault();
      if (!typing.value.trim()) { paintTypeLine(true); return; }
      return void submit(typing.value).catch(fail);
    }
    if (event.key === "Backspace") {
      event.preventDefault();
      typing.value = [...typing.value].slice(0, -1).join("");
      paintTypeLine(); return;
    }
    if (event.key.length !== 1) return;
    event.preventDefault();
    typing.value += event.key;
    paintTypeLine();
    return;
  }

  if (/^[1-9]$/.test(event.key)) {
    const index = Number(event.key) - 1;
    if (document.querySelector(`[data-choice="${index}"]`)) { event.preventDefault(); choose(index); }
    return;
  }
  if (event.key === "Enter" && state.chosen !== null) {
    event.preventDefault(); submit(state.chosen).catch(fail);
  }
});

// 語彙タイピング中はどこをクリックしてもキーを拾えるようにしておく。
document.addEventListener("click", () => {
  if (state.phase === "question" && state.current?.kind === "vocab") focusCatcher();
});

renderSetup().catch(fail);
state.phase = "setup";
</script>
</body>
</html>
