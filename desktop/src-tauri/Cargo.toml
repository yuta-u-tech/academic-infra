[package]
name = "acenglish-desktop"
version = "0.1.0"
description = "Academic-Infra English study cockpit (desktop)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }

[[bin]]
name = "acenglish-desktop"
path = "src/main.rs"
